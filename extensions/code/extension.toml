id = "code"
name = "Code"
version = "0.2.0"
description = "Your code forges in one place (GitHub, GitLab…): notifications, reviews waiting for you, your open pull/merge requests, repositories, CI status."

# The code front: Otto's daemon serves it from every provider of `code`.
capability = "capability.json"

[[recipe]]
name = "code-ci"
title = "CI en échec"
description = "Une alerte quand un build échoue sur tes dépôts, avec le job en cause ; rien quand tout passe."

[[recipe.watch]]
id = "code-ci-github"
output = "notify"
instruction = "Une activité de CI sur GitHub (dépôt et titre dans l'événement). Vérifie avec code.ci {repo: \"github:\" puis le dépôt} : un échec sur la branche concernée : importance normal, teaser : le dépôt et la branche ; text : le workflow ou job en échec, le titre du commit ou de la PR, le lien. Réussi, en cours ou déjà réparé : importance none."
trigger = { event = "code.notification", match = { forge = "github", reason = "ci_activity" } }

[[recipe.watch]]
id = "code-ci-gitlab"
output = "notify"
instruction = "Un pipeline GitLab en échec (dépôt et titre dans l'événement). Vérifie avec code.ci {repo: \"gitlab:\" puis le dépôt} : toujours en échec : importance normal, teaser : le dépôt et la branche ; text : le job en échec, le titre du commit ou de la MR, le lien. Réparé depuis : importance none."
trigger = { event = "code.notification", match = { forge = "gitlab", reason = "build_failed" } }
