id = "tmdb"
name = "TMDB"
version = "0.1.0"
description = "Movies provider: search, details, trends, TMDB rating and where to watch (The Movie Database API, your own token; JustWatch data)."

# Stdlib-only Python on api.themoviedb.org with your API read access token:
# `samantha provider set-key tmdb`. Not endorsed or certified by TMDB.
[[mcp]]
name = "tmdb"
command = "python3"
args = ["server.py"]
secrets = { TMDB_TOKEN = "secret:tmdb" }

[[provides]]
capability = "movies"
server = "tmdb"

[needs]
network = true
secrets = ["tmdb"]
